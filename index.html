<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系統登入 · 管理介面</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* 登入卡 */
        .login-container { background: rgba(22, 34, 48, 0.9); backdrop-filter: blur(10px); width: 100%; max-width: 440px; padding: 40px 32px; border-radius: 32px; box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 215, 0, 0.15); transition: all 0.3s ease; }
        .login-container.hidden { display: none; }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { font-size: 2.2rem; font-weight: 600; background: linear-gradient(135deg, #f5e6b0, #d4af37); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px; margin-bottom: 6px; }
        .login-header p { color: #8a9bb0; font-size: 0.9rem; letter-spacing: 1px; }
        .input-group { margin-bottom: 22px; position: relative; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #c0a86a; font-size: 1.1rem; }
        .input-group input { width: 100%; padding: 16px 18px 16px 50px; background: rgba(8, 16, 24, 0.8); border: 1.5px solid #2f3f50; border-radius: 18px; font-size: 1rem; color: #f0f4fa; outline: none; transition: 0.25s; }
        .input-group input:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37, #b8942c); border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 700; color: #0b1219; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
        .login-btn:hover { background: linear-gradient(135deg, #e7c451, #c9a132); transform: translateY(-2px); }
        .error-msg { color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 18px; min-height: 20px; }

        /* 主介面與響應式佈局 */
        .dashboard { display: none; width: 100%; max-width: 1400px; height: 90vh; min-height: 600px; background: #0b141e; border-radius: 36px; overflow: hidden; box-shadow: 0 30px 60px -15px black; border: 1px solid #2d3f52; position: relative; }
        .dashboard.active { display: flex; }

        /* 手機端頂部導航 (預設隱藏) */
        .mobile-header { display: none; align-items: center; justify-content: space-between; background: #0a121b; padding: 16px 20px; border-bottom: 1px solid #26323f; z-index: 100; width: 100%; }
        .mobile-menu-btn { background: transparent; border: none; color: #d4af37; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        .mobile-title { color: #f0e6d2; font-weight: 600; font-size: 1.1rem; }
        
        /* 側邊欄 */
        .sidebar { width: 260px; background: #0a121b; padding: 24px 18px; display: flex; flex-direction: column; border-right: 1px solid #26323f; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 200; }
        
        /* 手機端選單遮罩 */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 150; opacity: 0; transition: opacity 0.3s; }

        .sidebar-header { display: flex; align-items: center; gap: 12px; padding: 0 8px 20px 8px; border-bottom: 1px solid #1e2b38; margin-bottom: 16px; }
        .sidebar-header i { font-size: 2rem; color: #d4af37; }
        .sidebar-header h3 { color: #f0e6d2; font-weight: 500; font-size: 1.2rem; }
        .sidebar-header span { color: #8b9bb0; font-size: 0.75rem; display: block; }
        
        .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 20px; background: #11212e; border-radius: 12px; color: #d4af37; font-weight: 500; border: 1px solid #294054; }

        .nav-buttons { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
        .nav-btn { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: transparent; border: 1px solid transparent; border-radius: 16px; color: #cbd5e1; font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; }
        .nav-btn i { width: 24px; color: #a7925c; font-size: 1.2rem; }
        .nav-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: rgba(212, 175, 55, 0.3); color: #f1e9d3; }
        .nav-btn.active { background: linear-gradient(90deg, #d4af37 0%, #a88629 100%); color: #0b1117; font-weight: 700; border-color: #f5e6b0; }
        .nav-btn.active i { color: #0b1117; }

        .sidebar-return-btn { display: none; margin-top: 10px; padding: 14px 20px; background: #2a1f1f; border: 1px solid #d4af37; border-radius: 16px; color: #d4af37; font-weight: 500; align-items: center; gap: 14px; cursor: pointer; font-size: 1rem; transition: 0.2s; width: 100%; text-align: left; }
        .sidebar-return-btn:hover { background: #d4af37; color: #0b1117; }
        
        .logout-btn { margin-top: 10px; padding: 14px 20px; background: #1a2532; border: 1px solid #3a4b5e; border-radius: 16px; color: #cbd5e1; font-weight: 500; display: flex; align-items: center; gap: 14px; cursor: pointer; font-size: 1rem; width: 100%; text-align: left; }
        .logout-btn:hover { background: #2a1f1f; border-color: #f87171; color: #fecaca; }
        .logout-btn i { color: #f87171; }

        /* 右側內容區 */
        .main-content-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #101c27; position: relative; }
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
        .content-panel { flex: 1; display: flex; flex-direction: column; padding: 24px; }
        .content-panel.iframe-mode { padding: 0; }

        /* 設定頁面樣式 */
        .settings-section { background: #0e1923; border-radius: 28px; padding: 28px 26px; border: 1px solid #253341; }
        .settings-section h3 { color: #d4af37; font-weight: 400; font-size: 1.4rem; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .settings-card { background: #0f1c27; border-radius: 22px; padding: 22px 24px; margin-bottom: 28px; border: 1px solid #2d4052; }
        .settings-card h4 { color: #b9c7da; font-weight: 400; margin-bottom: 18px; font-size: 1.1rem; }
        .form-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 14px; }
        .form-field { flex: 1 1 180px; min-width: 100%; }
        .form-field label { display: block; color: #94a3b8; font-size: 0.8rem; margin-bottom: 6px; }
        .form-field input { width: 100%; padding: 12px 16px; background: #08111a; border: 1px solid #34495e; border-radius: 14px; color: #f1f5f9; outline: none; }
        .form-field input:focus { border-color: #d4af37; }
        .btn-primary { background: #d4af37; border: none; padding: 12px 26px; border-radius: 14px; font-weight: 700; color: #0b1117; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; }
        .btn-primary:hover { background: #e7c451; transform: translateY(-2px); }
        .btn-secondary { background: #233441; border: 1px solid #3e556b; padding: 12px 24px; border-radius: 14px; color: #d1dbe9; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; }
        .msg-feedback { margin-top: 14px; font-size: 0.9rem; color: #6ee7b7; min-height: 22px; }
        .msg-feedback.error { color: #f87171; }
        .button-list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
        .button-item { display: flex; justify-content: space-between; align-items: center; background: #11212e; padding: 12px 18px; border-radius: 16px; border: 1px solid #294054; flex-wrap: wrap; gap: 10px; }
        .button-item .info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .button-item .name { font-weight: 600; color: #e2e8f0; }
        .button-item .url { font-size: 0.75rem; color: #8fa6bd; word-break: break-all; }
        .button-item .actions { display: flex; gap: 8px; }
        .icon-btn { background: transparent; border: 1px solid #334b61; color: #b9c7da; padding: 8px 12px; border-radius: 12px; cursor: pointer; }
        .icon-btn:hover { background: #1f3343; border-color: #d4af37; }
        .icon-btn.danger:hover { border-color: #f87171; color: #fecaca; }
        .small-note { font-size: 0.75rem; color: #6c829c; margin-top: 12px; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a121b; }
        ::-webkit-scrollbar-thumb { background: #3a4f64; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        .iframe-wrapper { position: relative; width: 100%; height: 100%; border-radius: 0; overflow: hidden; background: #ffffff; flex: 1; }
        .content-iframe { width: 100%; height: 100%; border: none; background: #ffffff; }

        /* 響應式設計 */
        @media (min-width: 769px) {
            .form-field { min-width: 180px; }
            .btn-primary, .btn-secondary { width: auto; }
        }

        @media (max-width: 768px) {
            body { padding: 0; }
            .dashboard { height: 100vh; max-width: 100%; border-radius: 0; border: none; flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar { position: absolute; top: 0; left: 0; height: 100%; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .login-container { padding: 30px 20px; border-radius: 24px; margin: 0 16px; }
            .login-header h1 { font-size: 1.8rem; }
            .content-panel { padding: 16px; }
            .settings-section { padding: 20px 16px; border-radius: 20px; }
            .settings-card { padding: 16px; border-radius: 16px; }
            .button-item .actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <!-- 登入介面 (已移除預設 value) -->
    <div id="loginContainer" class="login-container">
        <div class="login-header">
            <h1>系統登入</h1>
            <p>請輸入管理員帳號密碼</p>
        </div>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="loginUsername" placeholder="賬號名稱" autocomplete="off">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="密碼" autocomplete="new-password">
        </div>
        <button class="login-btn" id="loginBtn">
            <i class="fas fa-arrow-right-to-bracket"></i> 登入
        </button>
        <div id="loginError" class="error-msg"></div>
    </div>

    <!-- 主介面 (後台) -->
    <div id="dashboard" class="dashboard">
        
        <!-- 手機端頂部導航列 -->
        <header class="mobile-header">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            <span class="mobile-title" id="mobilePageTitle">百家樂牌例</span>
            <div style="color: #d4af37; font-size: 1.2rem;">
                <i class="fas fa-user-circle"></i>
            </div>
        </header>

        <!-- 側邊欄遮罩 (手機端點擊關閉選單) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 左側邊欄 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-crown"></i>
                <div>
                    <h3>娛樂城</h3>
                    <span>管理後台</span>
                </div>
            </div>
            
            <div class="sidebar-user">
                <i class="fas fa-user-circle"></i> <span id="sidebarAdminName">admin</span>
            </div>

            <div class="nav-buttons" id="navButtonsContainer">
                <!-- 按鈕由 JavaScript 動態生成 -->
            </div>
            
            <!-- 側邊欄返回按鈕 -->
            <button class="sidebar-return-btn" id="sidebarReturnBtn">
                <i class="fas fa-undo"></i> 返回系統
            </button>
            
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> 登出
            </button>
        </aside>

        <!-- 右側內容區 -->
        <main class="main-content-wrapper">
            <div class="main-content">
                <div class="content-panel" id="contentPanel">
                    <!-- 動態內容會渲染到這裡 -->
                </div>
            </div>
        </main>
    </div>

    <script>
        (function() {
            // ---------- 數據初始化 ----------
            if (!localStorage.getItem('users')) {
                const defaultUsers = [
                    { username: 'admin', password: '123456' }
                ];
                localStorage.setItem('users', JSON.stringify(defaultUsers));
            }

            if (!localStorage.getItem('navButtons')) {
                const defaultButtons = [
                    { id: 'baccarat', name: '百家樂牌例', url: 'https://alexkong123.github.io/cards-rules/', icon: 'fa-diamond' },
                    { id: '95', name: '95數', url: 'https://alexkong123.github.io/discount95-game/', icon: 'fa-hashtag' },
                    { id: 'roulette', name: '輪盤', url: 'https://alexkong123.github.io/Roulette123/', icon: 'fa-circle-notch' },
                    { id: 'dice', name: '骰寶', url: 'https://alexkong123.github.io/sicbo/', icon: 'fa-dice' },
                    { id: 'paigow', name: '牌九', url: 'https://alexkong123.github.io/PG-Game-WP/', icon: 'fa-th' },
                    { id: 'settings', name: '設定', url: '#settings', icon: 'fa-gear' }
                ];
                localStorage.setItem('navButtons', JSON.stringify(defaultButtons));
            }

            // 輔助函數
            const getUsers = () => JSON.parse(localStorage.getItem('users'));
            const saveUsers = (users) => localStorage.setItem('users', JSON.stringify(users));
            const getNavButtons = () => JSON.parse(localStorage.getItem('navButtons'));
            const saveNavButtons = (btns) => localStorage.setItem('navButtons', JSON.stringify(btns));

            // 當前狀態
            let currentUser = null;
            let activeButtonId = 'baccarat';

            // ---------- DOM 元素 ----------
            const loginContainer = document.getElementById('loginContainer');
            const dashboard = document.getElementById('dashboard');
            const loginBtn = document.getElementById('loginBtn');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginError = document.getElementById('loginError');
            const logoutBtn = document.getElementById('logoutBtn');
            const navButtonsContainer = document.getElementById('navButtonsContainer');
            const contentPanel = document.getElementById('contentPanel');
            const sidebarAdminName = document.getElementById('sidebarAdminName');
            const sidebarReturnBtn = document.getElementById('sidebarReturnBtn');
            
            // 手機版選單相關
            const sidebar = document.getElementById('sidebar');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const mobilePageTitle = document.getElementById('mobilePageTitle');

            // ---------- 手機選單開合邏輯 ----------
            function toggleMobileMenu() {
                sidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }
            function closeMobileMenu() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            }

            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            sidebarOverlay.addEventListener('click', closeMobileMenu);

            // ---------- 登入邏輯 ----------
            function login() {
                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();
                const users = getUsers();
                const found = users.find(u => u.username === username && u.password === password);

                if (found) {
                    currentUser = username;
                    loginError.textContent = '';
                    loginContainer.classList.add('hidden');
                    dashboard.classList.add('active');
                    sidebarAdminName.textContent = currentUser;
                    
                    renderNavButtons();
                    
                    const buttons = getNavButtons();
                    const defaultBtn = buttons.find(b => b.id === 'baccarat') || buttons[0];
                    if (defaultBtn) {
                        switchPage(defaultBtn.id); 
                    }
                } else {
                    loginError.textContent = '賬號或密碼錯誤，請重試。';
                }
            }

            // ---------- 登出邏輯 ----------
            function logout() {
                currentUser = null;
                dashboard.classList.remove('active');
                loginContainer.classList.remove('hidden');
                
                // 清空輸入框
                loginUsername.value = '';
                loginPassword.value = '';
                
                loginError.textContent = '';
                activeButtonId = 'baccarat';
                contentPanel.innerHTML = ''; 
                sidebarReturnBtn.style.display = 'none';
                closeMobileMenu(); 
            }

            // ---------- 渲染側邊欄按鈕 ----------
            function renderNavButtons() {
                const buttons = getNavButtons();
                navButtonsContainer.innerHTML = '';

                if (buttons.length === 0) {
                    navButtonsContainer.innerHTML = '<p style="color:#6c829c; padding:8px;">暫無按鈕，請在設定中新增</p>';
                    return;
                }

                buttons.forEach(btn => {
                    const buttonEl = document.createElement('button');
                    buttonEl.className = `nav-btn ${activeButtonId === btn.id ? 'active' : ''}`;
                    buttonEl.dataset.id = btn.id;
                    buttonEl.innerHTML = `<i class="fas ${btn.icon || 'fa-circle'}"></i> ${btn.name}`;
                    buttonEl.addEventListener('click', () => {
                        switchPage(btn.id);
                        closeMobileMenu();
                    });
                    navButtonsContainer.appendChild(buttonEl);
                });
            }

            // 注意：switchPage 與設定頁面渲染將在第 3 段實現
                     // ---------- 頁面切換邏輯 ----------
            function switchPage(buttonId) {
                const buttons = getNavButtons();
                const btn = buttons.find(b => b.id === buttonId);
                if (!btn) return;

                // 更新 active 狀態
                activeButtonId = buttonId;
                document.querySelectorAll('.nav-btn').forEach(el => {
                    if (el.dataset.id === buttonId) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });

                // 更新手機端頂部標題
                mobilePageTitle.textContent = btn.name;

                // 如果是「設定」按鈕
                if (buttonId === 'settings') {
                    contentPanel.classList.remove('iframe-mode');
                    sidebarReturnBtn.style.display = 'none'; // 設定頁面不需要返回按鈕
                    renderSettingsPage();
                    return;
                }

                // 判斷如果是完整的外部網址，顯示側邊欄「返回系統」按鈕並全螢幕載入 iframe
                if (btn.url && (btn.url.startsWith('http://') || btn.url.startsWith('https://'))) {
                    contentPanel.classList.add('iframe-mode');
                    sidebarReturnBtn.style.display = 'flex'; // 顯示側邊欄返回按鈕
                    
                    contentPanel.innerHTML = `
                        <div class="iframe-wrapper">
                            <iframe src="${btn.url}" class="content-iframe" allow="fullscreen"></iframe>
                        </div>
                    `;
                } else {
                    // 本地錨點或無網址，顯示模擬內容，隱藏返回按鈕
                    contentPanel.classList.remove('iframe-mode');
                    sidebarReturnBtn.style.display = 'none';
                    
                    contentPanel.innerHTML = `
                        <div class="settings-section" style="background:#0e1923; border-radius:28px; padding:40px; flex:1;">
                            <h3 style="color:#d4af37; font-weight:300;">
                                <i class="fas ${btn.icon || 'fa-circle'}"></i> ${btn.name}
                            </h3>
                            <p style="color:#a0b3c9; margin-top:20px; font-size:1.1rem;">
                                您正在瀏覽 <strong>${btn.name}</strong> 頁面。
                            </p>
                            <p style="color:#6c829c; margin-top:20px;">網址連結: ${btn.url || '無'}</p>
                            <p style="color:#4a5d72; margin-top:40px; font-style:italic;">
                                （若要在系統內顯示真實網頁，請在設定中輸入以 http:// 或 https:// 開頭的完整網址）
                            </p>
                        </div>
                    `;
                }
            }

            // ---------- 設定頁面渲染（HTML 模板） ----------
            function renderSettingsPage() {
                const users = getUsers();
                const buttons = getNavButtons();

                contentPanel.innerHTML = `
                    <div class="settings-section">
                        <h3><i class="fas fa-sliders-h"></i> 系統設定</h3>

                        <!-- 更改密碼 -->
                        <div class="settings-card">
                            <h4><i class="fas fa-key"></i> 更改密碼</h4>
                            <div class="form-row">
                                <div class="form-field">
                                    <label>當前密碼</label>
                                    <input type="password" id="oldPassword" placeholder="輸入當前密碼">
                                </div>
                                <div class="form-field">
                                    <label>新密碼</label>
                                    <input type="password" id="newPassword" placeholder="輸入新密碼">
                                </div>
                                <div class="form-field">
                                    <label>確認新密碼</label>
                                    <input type="password" id="confirmPassword" placeholder="再次輸入新密碼">
                                </div>
                                <button class="btn-primary" id="changePasswordBtn">
                                    <i class="fas fa-save"></i> 更新
                                </button>
                            </div>
                            <div id="passwordFeedback" class="msg-feedback"></div>
                        </div>

                        <!-- 新增用戶 -->
                        <div class="settings-card">
                            <h4><i class="fas fa-user-plus"></i> 新增用戶</h4>
                            <div class="form-row">
                                <div class="form-field">
                                    <label>用戶名</label>
                                    <input type="text" id="newUsername" placeholder="輸入新用戶名" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label>密碼</label>
                                    <input type="password" id="newUserPassword" placeholder="輸入密碼">
                                </div>
                                <button class="btn-primary" id="addUserBtn">
                                    <i class="fas fa-plus-circle"></i> 新增用戶
                                </button>
                            </div>
                            <div id="userFeedback" class="msg-feedback"></div>
                            <div class="small-note">當前用戶總數: <span id="userCount">${users.length}</span></div>
                        </div>

                        <!-- 主介面按鍵管理 -->
                        <div class="settings-card">
                            <h4><i class="fas fa-th-list"></i> 主介面按鍵管理</h4>
                            <div class="form-row">
                                <div class="form-field">
                                    <label>按鍵名稱</label>
                                    <input type="text" id="btnName" placeholder="例如: 21點">
                                </div>
                                <div class="form-field">
                                    <label>連結網址</label>
                                    <input type="text" id="btnUrl" placeholder="例如: https://...">
                                </div>
                                <div class="form-field">
                                    <label>圖標 (FontAwesome)</label>
                                    <input type="text" id="btnIcon" placeholder="例如: fa-spade" value="fa-circle">
                                </div>
                                <button class="btn-primary" id="addButtonBtn">
                                    <i class="fas fa-plus"></i> 新增按鍵
                                </button>
                            </div>
                            <div id="buttonFeedback" class="msg-feedback"></div>

                            <h4 style="margin-top: 24px; margin-bottom: 12px;">
                                <i class="fas fa-list"></i> 現有按鍵
                            </h4>
                            <div class="button-list" id="buttonList">
                                ${buttons.map(btn => `
                                    <div class="button-item" data-id="${btn.id}" data-name="${btn.name}" data-url="${btn.url}" data-icon="${btn.icon || 'fa-circle'}">
                                        <div class="info">
                                            <span class="name">
                                                <i class="fas ${btn.icon || 'fa-circle'}" style="margin-right:8px;"></i>${btn.name}
                                            </span>
                                            <span class="url">${btn.url}</span>
                                        </div>
                                        <div class="actions">
                                            <button class="icon-btn edit-btn" data-id="${btn.id}">
                                                <i class="fas fa-pen"></i> 修改
                                            </button>
                                            <button class="icon-btn danger delete-btn" data-id="${btn.id}">
                                                <i class="fas fa-trash"></i> 刪除
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="small-note">
                                提示：點擊「修改」會將按鍵資料填入上方表單，修改後點擊「更新按鍵」即可保存。
                            </div>
                        </div>
                    </div>
                `;

                // 綁定設定頁面內的事件
                bindSettingsEvents();
            }
                        // ---------- 設定頁面事件綁定 ----------
            function bindSettingsEvents() {
                // === 更改密碼 ===
                document.getElementById('changePasswordBtn').addEventListener('click', function() {
                    const oldPwd = document.getElementById('oldPassword').value.trim();
                    const newPwd = document.getElementById('newPassword').value.trim();
                    const confirmPwd = document.getElementById('confirmPassword').value.trim();
                    const feedback = document.getElementById('passwordFeedback');
                    feedback.classList.remove('error');

                    if (!oldPwd || !newPwd || !confirmPwd) {
                        feedback.textContent = '請填寫所有密碼欄位。';
                        feedback.classList.add('error');
                        return;
                    }
                    if (newPwd !== confirmPwd) {
                        feedback.textContent = '新密碼與確認密碼不一致。';
                        feedback.classList.add('error');
                        return;
                    }
                    if (newPwd.length < 3) {
                        feedback.textContent = '密碼長度至少3個字元。';
                        feedback.classList.add('error');
                        return;
                    }

                    const users = getUsers();
                    const userIndex = users.findIndex(u => u.username === currentUser && u.password === oldPwd);
                    if (userIndex === -1) {
                        feedback.textContent = '當前密碼錯誤。';
                        feedback.classList.add('error');
                        return;
                    }

                    users[userIndex].password = newPwd;
                    saveUsers(users);
                    feedback.textContent = '密碼已成功更新！';
                    feedback.classList.remove('error');
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                });

                // === 新增用戶 ===
                document.getElementById('addUserBtn').addEventListener('click', function() {
                    const username = document.getElementById('newUsername').value.trim();
                    const password = document.getElementById('newUserPassword').value.trim();
                    const feedback = document.getElementById('userFeedback');
                    feedback.classList.remove('error');

                    if (!username || !password) {
                        feedback.textContent = '請填寫用戶名及密碼。';
                        feedback.classList.add('error');
                        return;
                    }
                    if (password.length < 3) {
                        feedback.textContent = '密碼長度至少3個字元。';
                        feedback.classList.add('error');
                        return;
                    }

                    const users = getUsers();
                    if (users.some(u => u.username === username)) {
                        feedback.textContent = '用戶名已存在。';
                        feedback.classList.add('error');
                        return;
                    }

                    users.push({ username, password });
                    saveUsers(users);
                    feedback.textContent = `用戶 ${username} 新增成功！`;
                    feedback.classList.remove('error');
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newUserPassword').value = '';
                    document.getElementById('userCount').textContent = users.length;
                });

                // === 主介面按鍵管理 ===
                let editingButtonId = null;

                const btnNameInput = document.getElementById('btnName');
                const btnUrlInput = document.getElementById('btnUrl');
                const btnIconInput = document.getElementById('btnIcon');
                const addButtonBtn = document.getElementById('addButtonBtn');
                const buttonFeedback = document.getElementById('buttonFeedback');
                const buttonListEl = document.getElementById('buttonList');

                function resetButtonForm() {
                    btnNameInput.value = '';
                    btnUrlInput.value = '';
                    btnIconInput.value = 'fa-circle';
                    editingButtonId = null;
                    addButtonBtn.innerHTML = '<i class="fas fa-plus"></i> 新增按鍵';
                    addButtonBtn.classList.remove('btn-secondary');
                    addButtonBtn.classList.add('btn-primary');
                    buttonFeedback.textContent = '';
                }

                function updateButtonListAndSidebar() {
                    const buttons = getNavButtons();
                    if (buttonListEl) {
                        buttonListEl.innerHTML = buttons.map(btn => `
                            <div class="button-item" data-id="${btn.id}" data-name="${btn.name}" data-url="${btn.url}" data-icon="${btn.icon || 'fa-circle'}">
                                <div class="info">
                                    <span class="name">
                                        <i class="fas ${btn.icon || 'fa-circle'}" style="margin-right:8px;"></i>${btn.name}
                                    </span>
                                    <span class="url">${btn.url}</span>
                                </div>
                                <div class="actions">
                                    <button class="icon-btn edit-btn" data-id="${btn.id}"><i class="fas fa-pen"></i> 修改</button>
                                    <button class="icon-btn danger delete-btn" data-id="${btn.id}"><i class="fas fa-trash"></i> 刪除</button>
                                </div>
                            </div>
                        `).join('');
                    }
                    renderNavButtons();
                }

                // 新增 / 更新按鍵
                addButtonBtn.addEventListener('click', function() {
                    const name = btnNameInput.value.trim();
                    const url = btnUrlInput.value.trim() || '#';
                    const icon = btnIconInput.value.trim() || 'fa-circle';
                    buttonFeedback.classList.remove('error');

                    if (!name) {
                        buttonFeedback.textContent = '請填寫按鍵名稱。';
                        buttonFeedback.classList.add('error');
                        return;
                    }

                    let buttons = getNavButtons();

                    if (editingButtonId) {
                        const index = buttons.findIndex(b => b.id === editingButtonId);
                        if (index === -1) {
                            buttonFeedback.textContent = '找不到要修改的按鍵。';
                            buttonFeedback.classList.add('error');
                            return;
                        }
                        if (buttons.some((b, i) => i !== index && b.name === name)) {
                            buttonFeedback.textContent = '已有相同名稱的按鍵。';
                            buttonFeedback.classList.add('error');
                            return;
                        }
                        buttons[index] = { ...buttons[index], name, url, icon };
                        saveNavButtons(buttons);
                        buttonFeedback.textContent = `按鍵「${name}」已更新！`;
                        buttonFeedback.classList.remove('error');
                        resetButtonForm();
                        updateButtonListAndSidebar();
                    } else {
                        if (buttons.some(b => b.name === name)) {
                            buttonFeedback.textContent = '已有相同名稱的按鍵。';
                            buttonFeedback.classList.add('error');
                            return;
                        }
                        const newId = 'btn_' + Date.now();
                        buttons.push({ id: newId, name, url, icon });
                        saveNavButtons(buttons);
                        buttonFeedback.textContent = `按鍵「${name}」已新增！`;
                        buttonFeedback.classList.remove('error');
                        resetButtonForm();
                        updateButtonListAndSidebar();
                    }
                });

                // 修改 / 刪除事件委託
                buttonListEl.addEventListener('click', function(e) {
                    const editBtn = e.target.closest('.edit-btn');
                    const deleteBtn = e.target.closest('.delete-btn');

                    if (editBtn) {
                        const id = editBtn.dataset.id;
                        const buttons = getNavButtons();
                        const target = buttons.find(b => b.id === id);
                        if (!target) return;

                        btnNameInput.value = target.name;
                        btnUrlInput.value = target.url;
                        btnIconInput.value = target.icon || 'fa-circle';
                        editingButtonId = id;

                        addButtonBtn.innerHTML = '<i class="fas fa-save"></i> 更新按鍵';
                        addButtonBtn.classList.remove('btn-primary');
                        addButtonBtn.classList.add('btn-secondary');
                        buttonFeedback.textContent = `正在編輯「${target.name}」，修改後點擊「更新按鍵」。`;
                        buttonFeedback.classList.remove('error');
                        btnNameInput.focus();
                        return;
                    }

                    if (deleteBtn) {
                        const id = deleteBtn.dataset.id;
                        if (id === 'settings') {
                            buttonFeedback.textContent = '「設定」按鍵不可刪除。';
                            buttonFeedback.classList.add('error');
                            return;
                        }
                        const buttons = getNavButtons();
                        const target = buttons.find(b => b.id === id);
                        if (!target) return;

                        if (!confirm(`確定要刪除按鍵「${target.name}」嗎？`)) return;

                        const newButtons = buttons.filter(b => b.id !== id);
                        saveNavButtons(newButtons);

                        if (activeButtonId === id) {
                            const first = newButtons[0];
                            if (first) {
                                switchPage(first.id);
                            } else {
                                contentPanel.innerHTML = '<p style="color:#6c829c;">暫無頁面</p>';
                            }
                        }

                        if (editingButtonId === id) {
                            resetButtonForm();
                        }

                        buttonFeedback.textContent = `按鍵「${target.name}」已刪除。`;
                        buttonFeedback.classList.remove('error');
                        updateButtonListAndSidebar();
                    }
                });
            }

            // ---------- 全局事件監聽器綁定 ----------
            
            // 登入 / 登出
            loginBtn.addEventListener('click', login);
            logoutBtn.addEventListener('click', logout);

            // Enter 快速登入
            loginPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
            loginUsername.addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });

            // === 側邊欄返回按鈕事件 ===
            sidebarReturnBtn.addEventListener('click', function() {
                // 恢復內邊距
                contentPanel.classList.remove('iframe-mode');
                // 隱藏返回按鈕
                sidebarReturnBtn.style.display = 'none';
                // 手機端點擊返回後自動收起選單
                closeMobileMenu(); 
                
                // 獲取當前按鈕資訊以顯示提示
                const buttons = getNavButtons();
                const btn = buttons.find(b => b.id === activeButtonId) || { name: '遊戲', url: '', icon: 'fa-gamepad' };
                
                // 顯示退出後的歡迎畫面
                contentPanel.innerHTML = `
                    <div class="settings-section" style="background:#0e1923; border-radius:28px; padding:40px; flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
                        <i class="fas ${btn.icon || 'fa-circle'}" style="font-size:4rem; color:#d4af37; margin-bottom:20px; opacity:0.8;"></i>
                        <h3 style="color:#d4af37; font-weight:300; font-size:1.8rem; margin-bottom:16px;">
                            已安全退出：${btn.name}
                        </h3>
                        <p style="color:#a0b3c9; font-size:1.1rem;">
                            您已成功從外部網頁返回系統。
                        </p>
                        <p style="color:#6c829c; margin-top:12px; word-break: break-all;">外部連結: <a href="${btn.url}" target="_blank" style="color:#d4af37; text-decoration:none;">${btn.url}</a></p>
                        <p style="color:#4a5d72; margin-top:40px; font-style:italic;">
                            （點擊左側選單可重新載入該網頁）
                        </p>
                    </div>
                `;
            });

        })();
    </script>
</body>
</html>
